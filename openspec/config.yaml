schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
context: |
  本仓是一个「仓库根 = skill 根」的紫微斗数 skill：排盘由确定性 CLI 产出，模型只负责解读。
  下列约束来自已定决策（ADR / 评审），读代码看不出来，改动前必须先读。

  ## 体系立场（不可动，C3）
  - 排盘与运限四化以**文墨天机**为准；论断框架严格按**倪海厦《天纪》三合派**（命宫为本、三方为用）。
  - **飞星派继续禁用**：宫干自化（`Palace.selfMutagen`）与来因宫不得实现、不得填回。
    该字段与 `SelfMutagenMark` / `DecadalMutagen` 类型是**刻意保留的绊线**，
    `test/school.test.ts` 有断言盯它们不被填回 —— 字段存在不等于该用，删它之前先读 `types.ts`。
  - 年龄一律**虚岁**（以农历年正月初一为界），不得换算成周岁；`currentDecadalIndex === -1`
    表示尚未起运，属正常，不得硬套大限。

  ## 失败可见性（全仓第一工程立场）
  - 宁可启动失败、当场报错，也不静默产出错盘、错时辰、错论断。静默兜底只允许给
    「不参与安星、不作下游索引键」的数据（如局数兜 3、四化越界空串）；参与判定链的
    输入（性别、日期、`--monthly` 裸开关）一律报错，绝不取默认值。
  - 静默吞参数已全数改为「报错 + 指路」（独占分支、未知参数、重复参数）；
    新代码不得引入兜底默认值、不得静默忽略无效输入。

  ## 分层红线（ADR-003）
  - 排盘内核（`algorithm.ts` / `mutagen.ts` / `patterns/` / `data/` / `wenmo-brightness.ts`）
    与知识内容（`analysis/` / `corpus/` / `synastry/`）严格分层。
    **插件层禁止反向依赖 `cli/`，禁止修改内核模块状态。**
  - 新增知识内容（古籍 / 主题断语 / 新流派）**不得触碰排盘内核与 CLI 分发**，
    也不因此需要重跑内核回归。
  - 轻路径纪律：重语料（tianji / oracle）只能在各自 `search` 体内 `await import`，
    注册表静态 import 的源必须轻；help / 未知命令路径不得触发 iztro 加载
    （`command-meta` 禁 import 命令实现与内核）。

  ## 引用而非迁移（ADR-004）
  - 插件**不得复制**亮度表、四化表、引文核对表等内核数据，只能**引用**。
    副本会漂移；`SchoolAdapter.citationRoots[].checklist` 引用全局唯一 `ANNOTATIONS` 即此意。

  ## 键域口径（单一真相源）
  - analysis 侧按宫名索引的数据表（次星宫位文案表 / 宫位内容键映射 / 主题关键宫位）一律用
    **展开形**宫名键，与运行时宫名域 `PALACE_NAMES_ORDER` 同域——带「宫」字，第 8 宫是交友宫，
    **不是** iztro 旧口径的「仆役宫」。紧凑形宫名键只作「运行时名 → 紧凑名」的归一中间量，
    不得直接出现在数据表里。
  - 十四主星名以 `scripts/data/stars.ts` 为唯一真相源；星曜内容表、星曜简述表、主题断语手册的
    主星键集与之一致，不各管一套。
  - 键域漂移（数据表键与运行时键不一致导致的静默 miss）属 typecheck 查不到的缺陷类，
    由 `test/invariants.test.ts` 的互证断言拦截；消费点不得用 `?? ""` 或「简述兜底」掩盖 miss。

  ## 注册表纪律（ADR-002）
  - 插件一律**清单注册**（`registry.ts` 显式 import），不用文件系统自动发现。
    新增插件 = 写文件 + 加一行；漏注册由 typecheck 兜底。

  ## 冻结内核契约
  - `test/kernel-contract.test.ts` 冻结内核对外形状（2026-10-12）。改动内核导出即破坏契约，
    必须显式说明并同步该测试，不要顺手改断言迁就实现。

  ## 分发形态（ADR-001 / G2）
  - 保持「拷贝 + `npm install`」单 skill 形态：**不引入构建步骤、不引入外部插件包**。
  - 分发件只含 `SKILL.md` / `package.json` / `references/` / `scripts/` 四项，
    zip 顶层目录名必须与 frontmatter `name` 一致。
  - **`scripts/` 的多层子目录原样收进包，不要拍平**：`boot-hooks` 的 `pickRoot` 按脚本自身
    所在目录定位内核，与层级无关；拍平要重写数百处 import 与 `load<>()` 字符串字面量
    （后者正则抓不到、typecheck 也抓不到，只在运行时炸），收益为零。
  - 代码里定位包内文件一律走 `ctx.root`，不写 `ROOT/../..` 这类上溯。

  ## 解析钩子（与 C4 同源）
  - `@/xxx` 与相对说明符的候选序（先 `.ts`、再 `同名目录/index.ts`）已被 typecheck 与
    `test/repo.test.ts` 双重钉死，任何目录重组不得破坏。

  ## 引文纪律
  - 凡出现「倪师 / 倪海厦 + 引号句」形态，必须在 `analysis/grades.ts` 登记档位，
    否则 `npm test` 引文守卫变红。**占位或自撰内容绝不可挂倪师引语**（属伪造引文）。
  - 守卫的扫描面同时覆盖 `.ts` 与 `.md`（`docs/` / `SKILL.md` / `references/` 等手写文档，
    见 `test/lib/citation-guard.ts` 的 `scanMarkdownCitations`）—— 往文档里写一句
    未核实引文与往源码里写一句同样变红；`docs/manual/` 是生成导出，按路径排除。

  ## 缓存
  - 改排盘内核输出结构或升级 `iztro` 时**必须递增 `CACHE_VERSION`**，否则旧缓存被当有效读回。
  - 回归链路恒设 `ZIWEI_NO_CACHE=1`，漏设会拿旧缓存**假绿**。
  - 缓存是性能优化，**绝不参与正确性**：读失败静默降级现排、写失败不得让排盘失败——
    缓存故障的正确表现是「慢」，不是「错」。

  ## 计数不写死
  - 断言数、测试项数、分发条目数这类计数**能自报就自报、能派生就派生**，
    不要在文档或代码里写死数字；其余交给断言盯双向一致。
  - **集合基数**（可增删的集合的大小，如主题 key 数）同样不得写死：代码、错误信息、
    help 描述与文档里一律从集合本身派生，断言盯「自报数 == 实际集合长度」。
  - **契约固定数**（解读五节、`--report` 板块数、十二宫、十四主星等）是显式登记的
    产品口径，允许写死，但不得与集合基数混算。

  ## 单点真相源（派生优于手抄）
  - 同一事实只允许一处权威定义、其余派生视图：参数面（`OPTION_GROUPS`）、主题
    （`TOPIC_DEFS`）、注册表键集、口径提示（`CaliberBasis`）皆单点 + 投影。
    手抄第二份 = 下一次漂移的伏笔（`OPTION_OWNERSHIP` 手抄表曾「承诺 ≠ 行为」）。
  - **例外**：`test/` 侧的独立预言机（内联重算、外部快照）不得顺手单点化——判据是
    「这份重算是产出还是核对」：产出收敛、核对留原地，收敛了就恒真失去验证力。

  ## 证据与假绿
  - 验证证据四形态：**断言 / 逐字节 diff / 计数 / 反向注入**，「看起来对」「应该没问题」
    不是证据形态；断言期望值必须来自独立路径，同源复读机式的断言再多也替代不了
    一条外部预言机。
  - 假绿灯下黑：退役命令名、async 断言未被 harness 等待（项数变少却全绿）、
    验收命令接管道或 `&&` 串接吃掉退出码、用 `any` / `@ts-ignore` 压制 typecheck、
    回归命中旧缓存（见缓存节）。
  - 「机器已经查了的，人不要重复查」：一句话判据——这句话能写成断言就交给守卫，
    不能才亲自看。自查只确认「没红」，评审标准与分档见 `docs/reviews/code-review-20261012.md`。

  ## 最小 diff 与生成物
  - 只格式化本次真正新增 / 改动的行，**不夹带无关格式改动**：整跑 format 会产出
    数万行纯排版噪声，逐字节 diff 与评审双双失效。
  - 生成文件不手改、改生成器再重导（`data/wenmo-tables.ts`、`corpus/data/tianji.ts`、
    `corpus/data/manual/`、cli-samples 产物）；重导前先想清楚 diff 只含预期变化。
  - 「重构不改行为」的任务，验收必须含**与改动前基线逐字节 diff=0**（先取基线再动手）。

  ## 文档即契约
  - 改模块的存在理由 / 对外契约 / 口径：**先改 `docs/code/<篇>.md` 再动代码**；
    源码内指路牌（一行摘要 + 指向 docs/code）不得删。
  - 改 CLI 参数名 / 输出格式：`SKILL.md`、`references/`、`docs/user-guide/`、cli-samples
    同批同步——断言只兜得住可机械比对的部分，其余靠这条纪律。
  - 文档里写的命令写完自己敲一遍；承诺不存在的保障不能两边都留着。

  ## 抽象与重构判据
  - **deletion test**：删掉它是让复杂度集中，还是只是搬家？搬家不算重构成果；
    去重优先于拆分，不为拆而拆（可挂起等下次实质改动顺手做）。
  - 每个新抽象必须答得出「删掉它会多写几行」，答不出就别加（per-topic case 文件
    因此被否决）；常量单一角色，一个常量不得身兼两职（`TOPIC_KEYS` 一名两用教训）。
  - **接缝判据**：加一个实现只需「一个文件 + 一行注册」；若还要改三处以上分发逻辑，
    那不是接缝，是把耦合换了位置。

  ## 验证闸门
  - 三层互不替代：`npm run typecheck`（类型自洽）· `selftest`（代码逻辑自洽）·
    `npm test`（外部基准比对）；风格另有 `npm run lint` / `npm run format`。
  - 新增 `test/*.test.ts` 必须同时登记 `test/README.md` 层表与 `test/lib/run.ts` 的 `LAYERS`。
  - 跳过断言只走 `kit.skipUnlessRepo`（判据：包根有没有 `AGENTS.md`），
    且跳过必须**看得见**（标 ⏭），不得给本就会随包分发的断言加跳过；
    仓库态零跳过由 `test/repo.test.ts` 的反恒真断言钉住。
  - 「内核层测试项数」是插件越界报警器：内容扩展型改动不得使内核层项数变动——
    项数一动先怀疑越界，而不是先改基线。

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - 明确写出「不做什么」，尤其当改动触及冻结内核契约或体系立场时
    - 改动按三档申报验证义务：内容扩展（不重跑内核回归）/ 内核或依赖改动
      （typecheck + selftest + npm test 三件套全跑）/ 纯重构（与基线逐字节 diff=0）
    - 被否决的备选方案写明理由留档——否决理由是后续决策的依据
  design:
    - 设计必须过三问：deletion test（删掉是复杂度集中还是搬家）/ 接缝判据
      （一个文件 + 一行注册）/ 抽象 justify（删掉它会多写几行）
    - 显式声明「不可逾越的约束」（既有决策列为不可动项）；
      决策记录写后果两面（收益与代价）
  specs:
    - 每条 requirement 的 scenario 必须可验证，能落到断言 / 逐字节 diff / 计数 /
      反向注入四形态之一
  tasks:
    - 每个任务给出可验证的完成判据（跑哪条命令、期望几个断言通过）
    - 涉及文件物理位置变动的任务，必须包含三类字符串的排查：import 语句、
      `load<>("@/…")` 字符串字面量、`resolve(ctx.root, …)` 拼路径
    - 行为不变的重构任务，完成判据必含「先取基线，再与基线逐字节 diff=0」
    - 验收命令的退出码直接取命令本身，不得接管道（`| tail` 后 `$?` 是 tail 的）
      或 `&&` 串接
    - 涉及生成文件的任务写「改生成器 + 重导」，禁止写「直接改产物」

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
  apply:
    guidance:
      - 改完先跑 `node scripts/purple-star.ts selftest`，全绿再跑 `npm test`
      - 改动内核或依赖 iztro 后两层都要跑；动过类型标注另跑 `npm run typecheck`
      - 不夹带无关改动：format 只对本次真正新增 / 改动的行跑，不整跑
      - 生成文件一律改生成器再重导，不直接改产物
      - 不用 `any` / `@ts-ignore` 绕过 typecheck 报错，去改类型标注本身
  archive:
    guidance:
      - 归档前确认文档中的计数类陈述与实跑末行一致
      - 若本次改动改变了项目约束，同步更新本文件的 context
