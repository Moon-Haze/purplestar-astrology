schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
context: |
    本仓是一个「仓库根 = skill 根」的紫微斗数 skill：排盘由确定性 CLI 产出，模型只负责解读。
    项目约束（体系立场、分层红线、验证闸门等已定决策）的**单一真相源是仓库根 `AGENTS.md`**
    的「项目约束（不可动）」一节，提案前先读它，本段不复制。
    最小兜底（细节以 AGENTS.md 为准）：
    - 排盘与运限四化以文墨天机为准，论断严格按倪海厦《天纪》三合派；飞星派（宫干自化、来因宫）禁用。
    - 年龄一律虚岁；`currentDecadalIndex === -1` 表示尚未起运，属正常。
    - 宁可启动失败、当场报错，也不静默产出错盘、错论断。

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
    proposal:
        - 明确写出「不做什么」，尤其当改动触及冻结内核契约或体系立场时
        - 改动按三档申报验证义务：内容扩展（不重跑内核回归）/ 内核或依赖改动
          （typecheck + selftest + npm test 三件套）/ 纯重构（与基线逐字节 diff=0）
        - 被否决的备选方案写明理由留档——否决理由是后续决策的依据
    design:
        - 设计必须过三问：deletion test（删掉是复杂度集中还是搬家）/ 接缝判据
          （一个文件 + 一行注册）/ 抽象 justify（删掉它会多写几行）
        - 显式声明「不可逾越的约束」（既有决策列为不可动项）；
          决策记录写后果两面（收益与代价）
    specs:
        - 每条 requirement 的 scenario 必须可验证，能落到断言 / 逐字节 diff / 计数 /
          反向注入四形态之一
    tasks:
        - 每个任务给出可验证的完成判据（跑哪条命令、期望什么结果）
        - 涉及文件物理位置变动的任务，必须排查三类字符串：import 语句、
          `load<>("@/…")` 字符串字面量、`resolve(ctx.root, …)` 拼路径
        - 行为不变的重构任务，完成判据必含「先取基线，再与基线逐字节 diff=0」
        - 涉及生成文件的任务写「改生成器 + 重导」，禁止写「直接改产物」

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
    apply:
        guidance:
            - 改完先跑 `node scripts/purple-star.ts selftest`，全绿再跑 `npm test`；
              动内核或依赖 iztro 后两层都要跑，动过类型标注另跑 `npm run typecheck`
            - 验收命令的退出码直接取命令本身，不得接管道（`| tail` 后 `$?` 是 tail 的）
              或 `&&` 串接
            - 回归链路恒设 `ZIWEI_NO_CACHE=1`，漏设会拿旧缓存假绿
            - 不夹带无关改动：format 只对本次真正新增 / 改动的行跑，不整跑
            - 不用 `any` / `@ts-ignore` 绕过 typecheck 报错，去改类型标注本身
    archive:
        guidance:
            - 归档前确认文档中的计数类陈述与实跑末行一致
            - 若本次改动改变了项目约束，先同步 `AGENTS.md` 的「项目约束（不可动）」节（单一真相源）
            - 归档完成后，把本次改动的代码、`openspec/specs/` 的主 spec、归档的 change 目录
              （`openspec/changes/archive/`）一并提交（一个逻辑变更一个 commit）
